services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: orpheon-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    expose:
      - "80"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - backend

  migrations:
    image: kukymbr/goose-docker:3.24.2
    depends_on:
      postgres-primary:
        condition: service_healthy
    env_file:
      - ../.config/.migrations.env
    volumes:
      - ../db/migrations:/migrations
    networks:
      - backend

  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      - URL=/openapi/openapi.yml
    expose:
      - "8080"
    volumes:
      - ../api/external/v1/http/openapi.yml:/openapi/openapi.yml
    networks:
      - backend

  loki:
    image: grafana/loki:2.9.8
    container_name: orpheon-loki
    command: -config.file=/etc/loki/local-config.yml
    expose:
      - "3100"
    volumes:
      - loki_data:/loki
      - ../monitoring/loki-config.yml:/etc/loki/local-config.yml
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: orpheon-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=adminstrongpassword
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/monitoring/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    expose:
      - "3000"
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - backend
    restart: unless-stopped
  
  promtail:
    image: grafana/promtail:latest
    container_name: orpheon-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../monitoring/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
