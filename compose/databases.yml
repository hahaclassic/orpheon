services:
  postgres-primary:
    image: bitnami/postgresql:latest
    env_file:
      - ../.config/.pg.primary.env
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/bitnami/postgresql
      - ../db/scripts:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app_rw"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: bitnami/postgresql:latest
    depends_on:
      postgres-primary:
        condition: service_healthy
    env_file:
      - ../.config/.pg.replica.env
    volumes:
      - postgres_replica_data:/bitnami/postgresql
      # - ../db/scripts/replica:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app_ro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    # container_name: orpheon-redis
    env_file:
      - ../.config/.redis.env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    command: redis-server --save "" --appendonly no --loglevel warning
    # command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    # container_name: orpheon-minio
    env_file:
      - ../.config/.minio.env
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
