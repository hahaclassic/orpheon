services:
  auth-msv-mirror:
    build:
      context: ../services/auth-msv
      dockerfile: Dockerfile
    environment:
      - READ_ONLY=false
      - USER_CREATOR_HOST=user-msv-mirror
    env_file:
      - ../.config/.auth.env
    expose:
      - "8080"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-msv-mirror:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    labels:
      - "logging=promtail"

  auth-msv-ro-mirror:
    build:
      context: ../services/auth-msv
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    environment:
      - READ_ONLY=true
      - USER_CREATOR_HOST=user-msv-mirror
    env_file:
      - ../.config/.auth.env
    expose:
      - "8080"
    depends_on:
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-msv-mirror:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    labels:
      - "logging=promtail"

