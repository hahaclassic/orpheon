      context: ../services/user-msv
      dockerfile: Dockerfile
    environment:
      - HTTP_PORT=8080
      - READ_ONLY=false
    env_file:
      - ../.config/.user.env
    expose:
      - "8080"
      - "50051"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    labels:
      - "logging=promtail"

  user-msv-ro-mirror:
    build:
      context: ../services/user-msv
      dockerfile: Dockerfile
    deploy:
