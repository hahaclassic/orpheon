  content-msv-mirror:
    build:
      context: ../services/content-msv
      dockerfile: Dockerfile
    environment:
      - READ_ONLY=false
      - USER_INFO_HOST=user-msv-mirror
    env_file:
      - ../.config/.content.env
    expose:
      - "8080"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      user-msv-mirror:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    labels:
      - "logging=promtail"

  content-msv-ro-mirror:
