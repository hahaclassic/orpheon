<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Documentation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="markdown-body" id="content">Loading documentation...</div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('/readme.md')
      .then(res => res.text())
      .then(md => {
        const fixedMd = md.replace(
          /!\[([^\]]*)\]\(\.\/([^)]+\.png)\)/g,
          '![$1](/img/$2)'
        );
        
        document.getElementById('content').innerHTML = marked.parse(fixedMd);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = 'Failed to load Markdown';
        console.error(err);
      });
  </script>
</body>
</html>
