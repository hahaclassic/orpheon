### GZIP
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;

gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    text/xml
    application/xml+rss
    text/javascript;
    
### Cache
# proxy_cache_path /var/cache/nginx/api
#     levels=1:2
#     keys_zone=public_api:200m
#     max_size=20g
#     inactive=10m
#     use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    server_tokens off;                
    add_header Server "Orpheon";

    root /etc/nginx/static;

    set $mirror "";
    if ($request_uri ~ ^/mirror/) {
        set $mirror "_mirror";
        
        # Delete /mirror from URL
        rewrite ^/mirror(.*) $1 break;
    }

    include /etc/nginx/conf.d/locations/*.conf;
}
