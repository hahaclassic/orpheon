# 1. index /
location = / {
    index index.html;
}

# 2. /reserved/ 
location /reserved {
    try_files /index.html =404;
}

# 3. /documentation
location /documentation {
    try_files /readme.html =404;
}

location /img/ {
    try_files $uri =404;
}

# 6. /managment
location /managment {
    try_files /managment.html =404;
}

# 4. Swagger UI
location /api/v1/ {
    proxy_pass http://swagger_ui/;  
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# OpenAPI spec
location = /openapi/openapi.yml {
    try_files /openapi.yml =404;
}

location /monitoring/ {
    proxy_pass http://grafana:3000;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_redirect default;
}

# 5. Status 
location = /status {
    try_files /status.html =404;
}

# internal location для stub_status
location = /status-metrics {
    stub_status on;
    access_log off;
}

location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

location /admin {
    proxy_set_header X-Script-Name /admin;
    proxy_set_header Host $host;
    proxy_pass http://pgadmin:80/;
    proxy_redirect off;
}

location /legacy {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /legacy/index.html;
}