upstream auth_msv {
    server orpheon-auth-msv-1:8080 weight=2;
    server orpheon-auth-msv-2:8080;
    server orpheon-auth-msv-3:8080;
}

upstream user_msv {
    server orpheon-user-msv-1:8080 weight=2;
    server orpheon-user-msv-2:8080;
    server orpheon-user-msv-3:8080;
}

server {
    listen 80;

    # internal auth endpoint
    location = /_auth {
        internal;
        proxy_pass http://auth_msv/api/v1/auth/claims;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # public endpoints
    # auth
    location = /api/v1/auth/register {
        proxy_pass http://auth_msv;
    }

    location = /api/v1/auth/login {
        proxy_pass http://auth_msv;
    }

    location = /api/v1/auth/refresh {
        proxy_pass http://auth_msv;
    }

    location = /api/v1/auth/logout {
        proxy_pass http://auth_msv;
    }

    # protected API
    # auth
    location = /api/v1/auth/password/update {
        auth_request /_auth;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $access_level $upstream_http_x_access_level;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Access-Level $access_level;

        proxy_pass http://auth_msv;
    }

    # user-msv
    location /api/v1/users/ {
        auth_request /_auth;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $access_level $upstream_http_x_access_level;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Access-Level $access_level;

        proxy_pass http://user_msv;
    }

    # content-msv

    # streaming-msv
}
