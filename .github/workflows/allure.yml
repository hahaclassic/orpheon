name: Run Go Tests with Allure

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'backend/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install golurectl
        run: cd backend && go install github.com/robotomize/go-allure/cmd/golurectl@latest

      - name: Run Unit Tests
        run: |
          cd backend
          go test -json ./internal/domain/... | golurectl -l -e -o allure-results --allure-suite Unit --allure-tags UNIT

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        with:
          name: unit-allure-results
          path: backend/allure-results

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install golurectl
        run: cd backend && go install github.com/robotomize/go-allure/cmd/golurectl@latest

      - name: Restore Unit Results
        uses: actions/download-artifact@v4
        with:
          name: unit-allure-results
          path: backend/unit-results

      - name: Merge Unit History
        run: |
          mkdir -p backend/allure-results/history
          cp -r backend/unit-results/allure-results/history/* backend/allure-results/history/ || true

      - name: Run Integration Tests
        run: |
          cd backend
          go test -json ./tests/integrations/... | golurectl -l -e -o allure-results --allure-suite Integration --allure-tags INTEGRATION

      - name: Upload Integration Results
        uses: actions/upload-artifact@v4
        with:
          name: integration-allure-results
          path: backend/allure-results

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install golurectl
        run: cd backend && go install github.com/robotomize/go-allure/cmd/golurectl@latest

      - name: Restore Previous Results
        uses: actions/download-artifact@v4
        with:
          name: unit-allure-results
          path: backend/unit-results
      - uses: actions/download-artifact@v4
        with:
          name: integration-allure-results
          path: backend/integration-results

      - name: Merge History
        run: |
          mkdir -p backend/allure-results/history
          cp -r backend/unit-results/allure-results/history/* backend/allure-results/history/ || true
          cp -r backend/integration-results/allure-results/history/* backend/allure-results/history/ || true

      - name: Run E2E Tests
        run: |
          cd backend
          go test -json ./tests/e2e/... | golurectl -l -e -o allure-results --allure-suite E2E --allure-tags E2E

      - name: Generate Allure Report
        run: |
          cd backend
          allure generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: backend/allure-report
