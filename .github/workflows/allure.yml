name: Run Go Tests with Allure

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'backend/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install golurectl
        run: cd backend && go install github.com/robotomize/go-allure/cmd/golurectl@latest

      - name: Download Allure history from previous runs
        uses: dawidd6/action-download-artifact@v2.27.0
        with:
          name: allure-history
          path: backend/report/allure-results
          if_no_artifact_found: warn

      - name: Run Unit Tests
        run: |
          cd backend
          mkdir -p report/allure-results
          go test -json ./internal/domain/... | golurectl -l -e -o report/allure-results --allure-suite Unit --allure-tags UNIT

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-unit
          path: backend/report/allure-results

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install golurectl
        run: cd backend && go install github.com/robotomize/go-allure/cmd/golurectl@latest

      - name: Download previous Allure results with history
        uses: actions/download-artifact@v4
        with:
          name: allure-results-unit
          path: backend/report/allure-results

      - name: Run Integration Tests
        run: |
          cd backend
          go test -json ./tests/integrations/... | golurectl -l -e -o report/allure-results --allure-suite Integration --allure-tags INTEGRATION

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-integration
          path: backend/report/allure-results

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install golurectl
        run: cd backend && go install github.com/robotomize/go-allure/cmd/golurectl@latest

      - name: Download previous Allure results with history
        uses: actions/download-artifact@v4
        with:
          name: allure-results-integration
          path: backend/report/allure-results

      - name: Run E2E Tests
        run: |
          cd backend
          go test -json ./tests/e2e/... | golurectl -l -e -o report/allure-results --allure-suite E2E --allure-tags E2E

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: backend/report/allure-results

  generate-report:
    name: Generate and Publish Allure Report
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download combined Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e
          path: backend/report/allure-results

      - name: Checkout gh-pages for history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: backend/report/allure-results
          allure_history: gh-pages
          gh_pages: gh-pages

      - name: Setup Git config
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GH_PAGES_PAT }}
          publish_branch: gh-pages
          publish_dir: gh-pages
          force_orphan: true

      - name: Upload Allure History for future runs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-history
          path: gh-pages/history
          retention-days: 30