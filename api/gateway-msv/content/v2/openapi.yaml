components:
  schemas:
    ArtistMeta:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        country:
          type: string

    AlbumMeta:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        label:
          type: string
        license_id:
          type: string
          format: uuid
        release_date:
          type: string
          format: date-time

    AlbumMetaAggregated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        label:
          type: string
        license:
          $ref: '#/components/schemas/License'
        release_date:
          type: string
          format: date-time
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistMeta'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'

    TrackMeta:
      type: object
      properties:
        id:
          type: string
          format: uuid
        genre_id:
          type: string
          format: uuid
        name:
          type: string
        duration:
          type: integer
        explicit:
          type: boolean
        license_id:
          type: string
          format: uuid
        album_id:
          type: string
          format: uuid
        track_number:
          type: integer
        total_streams:
          type: integer

    TrackMetaAggregated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        genre:
          $ref: '#/components/schemas/Genre'
        name:
          type: string
        duration:
          type: integer
        explicit:
          type: boolean
        license:
          $ref: '#/components/schemas/License'
        track_number:
          type: integer
        total_streams:
          type: integer
        album:
          $ref: '#/components/schemas/AlbumMeta'
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistMeta'

    TrackSegment:
      type: object
      required:
        - track_id
        - idx
        - total_streams
        - range
      properties:
        track_id:
          type: string
          format: uuid
        idx:
          type: integer
          minimum: 0
          description: Segment index within the track
          example: 0
        total_streams:
          type: integer
          minimum: 0
          description: Total number of streams for this segment
          example: 1500
        range:
          $ref: '#/components/schemas/Range'
      example:
        track_id: "123e4567-e89b-12d3-a456-426614174000"
        idx: 0
        total_streams: 1500
        range:
          start: 0
          end: 30

    Range:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: integer
          minimum: 0
          description: Start time of the segment in seconds
          example: 0
        end:
          type: integer
          minimum: 0
          description: End time of the segment in seconds
          example: 30
      example:
        start: 0
        end: 30

    SegmentsIdxs:
      type: object
      required:
        - track_id
        - idxs
      properties:
        track_id:
          type: string
          format: uuid
          description: Unique track identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        idxs:
          type: array
          items:
            type: integer
            minimum: 0
          description: Array of segment indices
          example: [0, 1, 2]

    License:
      type: object
      required:
        - id
        - title
        - description
        - url
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
          description: License title
          example: "Creative Commons Attribution"
        description:
          type: string
          maxLength: 500
          description: License description
          example: "Allows redistribution and reuse with attribution"
        url:
          type: string
          format: uri
          maxLength: 500
          description: URL to license details
          example: "https://creativecommons.org/licenses/by/4.0/"
      example:
        id: "123e4567-e89b-12d3-a456-426614174000"
        title: "Creative Commons Attribution"
        description: "Allows redistribution and reuse with attribution"
        url: "https://creativecommons.org/licenses/by/4.0/"

    Genre:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 50
          description: Genre title
          example: "Rock"
      example:
        id: "123e4567-e89b-12d3-a456-426614174000"
        title: "Rock"

    PlaylistMeta:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_private:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        rating:
          type: integer

    PlaylistMetaAggregated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/UserInfo'
        name:
          type: string
        description:
          type: string
        is_private:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        rating:
          type: integer
        is_favorite:
          type: boolean
        tracks_count:
          type: integer
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/TrackMeta'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
