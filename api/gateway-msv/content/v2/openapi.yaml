        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - label
                - license_id
                - release_date
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                  description: Album title
                label:
                  type: string
                  description: Record label
                license_id:
                  type: string
                  format: uuid
                  description: License ID
                release_date:
                  type: string
                  format: date-time
                  description: Release date
      responses:
        '201':
          description: Album created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
