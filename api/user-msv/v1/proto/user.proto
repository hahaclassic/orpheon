syntax = "proto3";

package user;
option go_package = "github.com/hahaclassic/orpheon/services/user-msv/pkg/proto/userpb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service UserService {
    rpc GetUser(UserIDRequest) returns (UserResponse);
    rpc GetMe(google.protobuf.Empty) returns (UserResponse);
    rpc UpdateMe(UpdateUserRequest) returns (google.protobuf.Empty);
    rpc DeleteUser(UserIDRequest) returns (google.protobuf.Empty);
}

enum AccessLevel {
    UNKNOWN = 0;
    USER = 1;
    ADMIN = 2;
}

message User {
    string id = 1;
    string name = 2;
    AccessLevel access_level = 3;
    google.protobuf.Timestamp registration_date = 4;
}

message UpdateUserRequest {
    User user = 1;
}

message UserIDRequest {
    string id = 1;
}

message UserResponse {
    User user = 1;
}
